[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdr"
version = "0.1.0"
description = "Production downtime and OEE reporting for manufacturing machines"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "fpdf2>=2.7",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.20"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
