[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdr"
version = "0.1.0"
description = "Production downtime and OEE reporting for manufacturing machines"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<4",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "pyyaml>=6.0,<7",
    "fpdf2>=2.7,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
app = ["streamlit>=1.66,<2", "plotly>=5.20,<8"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
