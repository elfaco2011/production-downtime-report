# Mapping for data/sample/plant_export.xlsx, an export with Italian column
# names and state labels. Copy this file and adapt it to your own export.
# Every key is optional: anything left out uses the default shown in the
# comments.

events:
  sheet: Eventi               # default: first sheet of the workbook
  columns:                    # internal field: your column name
    machine: Macchina
    start: Inizio
    end: Fine
    state: Stato
    reason: Causa
  state_values:               # internal state: your label(s), case-insensitive
    RUN: In marcia
    STOP: Fermo
    SETUP: Attrezzaggio       # e.g. mold change: counts as lost availability
    PLANNED: Pianificato      # breaks, preventive maintenance: not scheduled time
  # datetime_format: "%d/%m/%Y %H:%M"   # default: detected automatically
  # dayfirst: true                       # for 03/09/2026 = 3 September

production:
  sheet: Produzione           # default: second sheet of the workbook
  columns:
    machine: Macchina
    date: Data
    shift: Turno
    ideal_cycle_s: Ciclo ideale (s)
    good_parts: Pezzi buoni
    scrap_parts: Scarti
  # date_format: "%d/%m/%Y"

shifts:                       # quote the times
  A: {start: "06:00", end: "14:00"}
  B: {start: "14:00", end: "22:00"}
  # C: {start: "22:00", end: "06:00"}   # a shift may end the next day

micro_stop_minutes: 2         # unplanned stops shorter than this are micro-stops
micro_stops_as: performance   # or: availability (which OEE factor they reduce)
unlogged_time: loss           # or: exclude (shift minutes with no event logged)
