# Keep everything local: no usage statistics are sent to Streamlit, and
# the server listens on this computer only (no public-IP lookup at start).
[browser]
gatherUsageStats = false

[server]
address = "localhost"
maxUploadSize = 50


[theme]
base = "light"
primaryColor = "#2a78d6"

[theme.sidebar]
textColor = "#31333f"
