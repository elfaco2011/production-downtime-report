[browser]
gatherUsageStats = false

[client]
# Viewers see the app, not the Deploy button and developer menu.
toolbarMode = "viewer"

[theme]
base = "light"
primaryColor = "#2a78d6"

[theme.sidebar]
textColor = "#31333f"

[server]
# Upload limit in MB. The free Streamlit Cloud tier has little RAM; a very
# large file would slow the shared demo down for everyone.
maxUploadSize = 50
